# 每个交易日自动刷数据并发布到 GitHub Pages（https://vickingwu.github.io/ashare-board/）。
#
# 触发方式：
#   schedule          四个时段（北京时间）：交易日 20:17 主运行、22:47 重试 / 补齐、每天 07:53 兜底、交易日 11:23 补漏。
#                     A 股 15:00 收盘，但各数据源的当日数据要到 16:40 之后才陆续发布（2026-10-20 实测：中债登 16:39–16:57、
#                     乐咕 17:25–17:45、Baostock 全市场日线 17:30–18:00、中证指数与申万 18:25–18:45，当日即可拿到；申万偶有缺日），
#                     16:40 跑只能拿到 T−1。20:17 这次拿当日全部来源的数据；22:47 补主运行时缺失或失败的源（暖缓存，约 3–4 分钟）；
#                     07:53 补 T+1 公布的上交所两融与前夜迟到的源；11:23 只在前一天的运行全部没跑成时补回前一交易日。两个上午时段：
#                     日序列源（中证 / 申万 / 乐咕 / 中债登 / Baostock）16:00 前按规则不取当日行，但缓存按「日」判断新鲜，所以前一晚
#                     抓过的序列会再请求一遍（中证 26 条约 5 分钟，拿不到新行）；coverage 读腾讯实时行情，11:23 这次会发布一份
#                     标注「盘中快照」的当日 coverage.json，20:17 再被收盘值覆盖。四个时段是有意冗余的：GitHub 的定时任务不准时——
#                     2026-10-20 → 10-26 的 8 次定时运行每次延后 2.2–6.2 小时（12:30Z 那条 4.8–6.2 小时、23:30Z 那条 2.2–2.3 小时、
#                     10-20 当时的 08:40Z 那条 5.2 小时），GitHub 文档也说明负载高时排队的定时运行可能被整次丢掉；因此分钟数避开
#                     整点 / 半点的高峰并多排两次，任一时段没跑或失败都有后面的时段兜底；定时运行仍可能延迟几分钟到几小时。
#                     cron 用 UTC：23:53 UTC 已是北京次日，兜底那条不按星期过滤，周末 / 节假日跑到就是暖缓存空跑（各源无新数据、
#                     没有变化就不提交、Pages 原样重发；静态面板 loss 的 asOf 是常量，不会因运行日变化而改写）。
#   workflow_dispatch 手动运行；可选 only 参数原样传给 etl/build_data.py --only；可选 skip_days 作为 ASHARE_MARKET_SKIP_DAYS
#                     传给全市场日线库（逗号分隔的 YYYY-MM-DD：Baostock 永远没有数据的交易日，跳过不再重试）
#   push main         本地 make update 后 git push，也会重新发布（这种情况只跑 deploy，不再抓数）
#
# 两个作业放在同一次运行里是有意的：update 用 GITHUB_TOKEN 推送的数据提交不会再触发新的 workflow 运行，
# 所以 deploy 必须紧跟在 update 之后、并重新 checkout main 才能拿到刚推送的数据。
#
# 全市场日线库（trend / feargreed 面板的底层数据，cache/market/）也放在 actions/cache 里（tail 形态约 20 MB）。
# 缓存丢失或被淘汰时，etl/market_state.py 先从仓库里的种子 state/market_seed.zip 重建（约 5,500 只股票最近 252 个
# 交易日的后复权收盘 + 每日聚合 + 交易日历），再用 Baostock 的全市场单日横截面逐日补齐缺的交易日：每个交易日一次
# 查询（runner 上 25–55 秒），每次运行最多补 ASHARE_MARKET_BUDGET_MIN 分钟（默认 18）；没补完时两个面板照常生成并在
# 看板说明里提示，下次运行继续。trend 的 asOf 停在日线库最后一天；feargreed 以中证全指日历为轴，子指标不足 4 个的末日
# 综合分为空，页面显示 –。逐只股票抓全史的冷启动从不在这里跑（runner 上 18.2 秒/只，5,563 只约 28 小时，2026-10-21 实测），
# 只在本地做一次并通过种子提交；update 作业的 timeout-minutes 放宽到 150，是给「种子重建 + 多日补齐 + 申万全史」同时发生
# 的最坏情况留余量。
#
# M4 的月度来源（东方财富数据中心的 M2 / GDP / 70 城、上海黄金交易所 Au99.99）按月缓存：每月 20 日（金价为 1 日）之后的
# 首次运行各刷新一次，其余运行不请求；上交所每日概况每次运行一次；中证指数日行情请求间隔 12 ± 1 秒（其限流是约 100 秒窗口内
# 第 13 个左右的请求起 403 的突发计数：2026-10-26 本机 3 ± 1 秒第 15 个、5 ± 1 秒第 13 个都撞 403，10 / 12 ± 1 秒 26 条全过；
# 12 秒让 12 个请求至少跨 121 秒，26 条约 5 分钟），403 / 连接重置 / 超时按 30 → 60 → 120 → 240 秒
# 长退避重试（2026-10-24 早上 runner 从第一个请求起就被中证连续重置连接，短退避无济于事），一条序列用完退避仍失败则本轮不再
# 请求中证（后续中证面板直接失败隔离、保留旧 JSON）；全部面板跑完后，因网络类错误失败的面板暂停 60 秒、关掉熔断再构建一轮，
# 之后才写 manifest。整段运行中证一直不可达的最坏情形：两轮各一次 7.5 分钟退避，约 17 分钟。
name: update-and-deploy

on:
  schedule:
    - cron: '17 12 * * 1-5'  # UTC 12:17 周一至周五 = 北京 20:17 周一至周五：主运行，所有数据源当日数据已发布（中债登 16:39–16:57、乐咕 17:25–17:45、Baostock 17:30–18:00、中证与申万 18:25–18:45）
    - cron: '47 14 * * 1-5'  # UTC 14:47 周一至周五 = 北京 22:47：重试 / 补齐（暖缓存，约 3–4 分钟），补主运行时缺失或失败的源
    - cron: '53 23 * * *'    # UTC 23:53 每天 = 北京 07:53 每天（UTC 星期比北京早一天，所以不按星期过滤）：兜底，补 T+1 公布的上交所两融与前夜迟到的源；周末 / 节假日是暖缓存空跑，无新数据则不提交
    - cron: '23 3 * * 1-5'   # UTC 03:23 周一至周五 = 北京 11:23 周一至周五：补漏，前一天三次都没跑成（被 GitHub 丢掉或全部失败）时补回前一交易日（日序列源 16:00 前按规则不取当日行；coverage 会是标注「盘中快照」的当日行情，20:17 覆盖）
  workflow_dispatch:
    inputs:
      only:
        description: '只构建这些面板（逗号分隔 id，留空 = 全部），传给 etl/build_data.py --only'
        required: false
        default: ''
        type: string
      skip_days:
        description: '全市场日线库要跳过的交易日（逗号分隔 YYYY-MM-DD，留空 = 不跳过），作为 ASHARE_MARKET_SKIP_DAYS 传给 ETL；只对 Baostock 永远没有数据的日子使用'
        required: false
        default: ''
        type: string
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ashare-board-pages
  cancel-in-progress: false

jobs:
  update:
    # push 事件不抓数，直接发布；手动运行只在 main 上抓数，避免从其它分支把提交推到 main
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # cache/ 里的长历史（指数日行情、国债收益率、乐咕 PE、申万行业史、全市场日线库 cache/market/）在两次运行之间复用，
      # 每天只抓增量。key 带 run_id 所以每次都会存一份新的，restore-keys 前缀匹配取最近一次。
      - uses: actions/cache@v4
        with:
          path: cache
          key: etl-cache-${{ github.run_id }}
          restore-keys: |
            etl-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # ETL 自带面板级失败隔离：失败面板保留上一版 JSON、manifest 记 ok=false，页面显示黄色徽标。
      # 所以这一步即使退出码非 0 也继续往下走，把能更新的部分发布出去。
      - name: 抓数并生成 data/*.json
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
          # 手动运行时填的 skip_days（定时运行为空）：etl/market_state.py 跳过这些 Baostock 没有数据的交易日
          ASHARE_MARKET_SKIP_DAYS: ${{ inputs.skip_days }}
        run: |
          if [ -n "$ONLY" ]; then
            python etl/build_data.py --verbose --only "$ONLY"
          else
            python etl/build_data.py --verbose
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 14

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Shanghai date +%F) 自动更新"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: update
    # update 失败（装依赖、推送出错）就不发布；update 被跳过（push 事件）照常发布
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 必须显式取 main 的最新提交：github.sha 是本次运行开始时的提交，不含 update 刚推送的数据
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python scripts/build_site.py

      # enablement: true —— 仓库还没开 Pages 时自动按「GitHub Actions」方式开启；token 权限不够时这一步会报错，按 README「启用步骤」手工开启即可
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
